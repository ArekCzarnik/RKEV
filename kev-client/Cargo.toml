[package]
name = "kev-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust client for Kev, the small decision models that speak TypeSafe's System One API"
repository = "https://github.com/jaredpalmer/kev"
license = "Apache-2.0"

[dependencies]
# Question and option order is part of the request and can move the answer,
# so maps have to keep insertion order.
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
# `preserve_order` is not optional here: a JSON state is rendered into the
# prompt field by field, so the order its keys arrive in is part of the model
# input. Without it serde_json would sort them and the local engine would build
# a different prompt than the server.
serde_json = { version = "1", features = ["preserve_order"] }
# Only for spawn_blocking: a forward pass is CPU-bound and must not sit on an
# async runtime thread. Optional, pulled in by the `local` feature.
tokio = { version = "1", features = ["rt"], optional = true }
# The backbone. 0.9 is the last candle-core that does not drag in tokenizers
# with oniguruma, i.e. a C toolchain, for a crate we only want tensors from; we
# bring our own tokenizer. Both are optional, pulled in by the `qwen3` feature.
candle-core = { version = "0.9.2", default-features = false, optional = true }
candle-nn = { version = "0.9.2", default-features = false, optional = true }
# fancy-regex rather than the default onig, for the same reason.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }
# To read the temperature out of head.pt: a torch archive is a zip holding a
# pickle. candle-core already depends on the same crate, and the entries torch
# writes are stored, so no compression features are needed.
zip = { version = "7", default-features = false, optional = true }

[features]
default = ["http"]
# Talking to a Kev server over HTTP. Turn it off for a build that only uses a
# local inference engine; `SystemOne`, the types and the errors stay available.
http = ["dep:reqwest"]
# A local inference engine instead of an HTTP server. The prompt layout and the
# pointer-head readout are here; what is missing is a backbone behind `Forward`
# (hidden states, not logits - see .claude/tasks/2026-09-23-local-inference.md),
# so this still brings in only the runtime support the blocking call needs.
local = ["dep:tokio"]
# The attention-only Qwen3 backbone (the `@qwen3` checkpoints) in candle, as a
# `Forward` backend. The hybrid Qwen3.5 bases need Gated DeltaNet layers and are
# not implemented. Raises the MSRV to whatever candle needs.
qwen3 = ["local", "dep:candle-core", "dep:candle-nn", "dep:tokenizers", "dep:zip"]

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "triage"
required-features = ["http"]
